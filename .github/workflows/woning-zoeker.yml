name: Woning-zoeker Apeldoorn

on:
  schedule:
    - cron: '*/15 * * * *'   # elke 15 minuten (GitHub kan een paar minuten vertragen)
  workflow_dispatch:          # handmatig starten via de Actions-tab

permissions:
  contents: write             # om state/seen.json terug te committen

concurrency:
  group: woning-zoeker
  cancel-in-progress: false

jobs:
  zoek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-noble   # Chromium al geïnstalleerd
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: npm install --no-audit --no-fund

      - name: Zoeken
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/index.js

      - name: Gezien-lijst opslaan
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "woning-zoeker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Update gezien-lijst [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
